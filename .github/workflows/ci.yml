name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # chromium for vitest browser mode + playwright e2e (webServer builds
      # the app). Browsers are cached per Playwright version; `install` skips
      # the download on a cache hit and only the apt deps re-install.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run lint
      - run: npm run depcheck
      - run: npm run test:unit -- --run
      - run: npm run test:e2e

      # Unit, e2e (incl. failure traces/videos), and coverage reports all
      # land in test-result/ — upload them even when a test step fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: test-result/
          if-no-files-found: ignore

      # The dependency graph is generated, never committed — download it from
      # this run's artifacts. `dot` is not on the runner by default.
      - name: Render the dependency graph
        run: sudo apt-get install -y --no-install-recommends graphviz && npm run depgraph
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: dependency-graph.svg
          if-no-files-found: error
